[project]
name = "lunatiks-api"
version = "0.1.0"
description = "FastAPI backend of the Lunar Landing Site Navigator (NASA Space Apps 2026, team Lunatiks)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
